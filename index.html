<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ChaleChat FIXED - No Ghost</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:white;font-family:system-ui;display:flex;flex-direction:column;height:100vh}
.header{background:linear-gradient(90deg,#CE1126,#FCD116,#006B3F);padding:14px;text-align:center;font-weight:900}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 14px;border-radius:18px;max-width:80%;line-height:1.4}
.bot{background:#222;border:1px solid #FCD116;align-self:flex-start}
.me{background:#006B3F;align-self:flex-end}
#bar{display:flex;gap:8px;padding:12px;background:#111;border-top:1px solid #333}
#bar input{flex:1;padding:14px;border-radius:12px;border:1px solid #333;background:#222;color:white}
#bar button{padding:14px 20px;background:#FCD116;color:black;font-weight:900;border:none;border-radius:12px}
</style>
</head>
<body>
<div class="header">CHALECHAT FIXED ✅ NO GHOST - SALVATION TECH-GHANA</div>
<div id="msgs"><div class="msg bot">Akwaaba chaley — I dey! Type Hello, I go reply instant! 🇬🇭</div></div>
<div id="bar"><input id="txt" placeholder="Type Hello..." onkeypress="if(event.key==='Enter')doSend()"><button onclick="doSend()">Send 🚀</button></div>

<script>
// 100% LOCAL - NO FETCH - NO FAIL
function add(text, who){
  var box=document.getElementById('msgs');
  var div=document.createElement('div');
  div.className='msg '+(who==='me'?'me':'bot');
  div.textContent=text;
  box.appendChild(div);
  box.scrollTop=box.scrollHeight;
}
function getReply(t){
  t=t.toLowerCase();
  if(t.includes('hello')||t.includes('hi')||t.includes('hey')) return "Hello Kwame! 😎 Chaley how for? I dey live now! No more ghosting!";
  if(t.includes('how are you')) return "I dey cool! Body dey inside cloth! 😂 You?";
  if(t.includes('who are you')) return "I be ChaleBot from SALVATION TECH-GHANA! Made in Ghana 🇬🇭";
  if(t.includes('region')) return "Ghana get 16 regions o!";
  if(t.includes('planet')) return "8 planets dey!";
  return "I hear you: '"+t+"' — Talk more! I go reply every time now! No ghosting again!";
}
function doSend(){
  var inp=document.getElementById('txt');
  var text=inp.value.trim();
  if(!text) return;
  inp.value='';
  add(text,'me');
  // REPLY INSTANT - NO TIMEOUT FAIL
  setTimeout(function(){
    var reply=getReply(text);
    add(reply,'bot');
  }, 300);
}
console.log("ChaleChat FIXED loaded - NO GHOST");
</script>
</body>
</html>
