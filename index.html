<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChaleChat Ghana - Powered by SALVATION TECH-GHANA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui; background:#0f0f0f; color:white; min-height:100vh; display:flex; flex-direction:column}
.header{background:linear-gradient(90deg,#CE1126,#FCD116,#006B3F); padding:12px 16px; display:flex; justify-content:space-between; align-items:center}
.logo{font-weight:900; font-size:22px; color:white}
input,button{border-radius:10px; border:none; outline:none}
input{padding:10px 12px; background:#222; color:white; border:1px solid #333; width:100%}
button{padding:10px 16px; background:#FCD116; color:black; font-weight:700; cursor:pointer}
#loginPanel{max-width:420px; margin:40px auto; background:#1a1a1a; padding:24px; border-radius:16px; border:1px solid #333; width:90%}
.row{display:flex; flex-direction:column; gap:8px; margin-bottom:12px}
.langRow{display:flex; gap:8px}
.langRow button{flex:1; background:#222; color:white; border:1px solid #444}
.langRow button.active{background:#006B3F; color:white}
#chatArea{display:none; flex:1; flex-direction:column; overflow:hidden}
#messages{flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; background:#121212}
.msg{background:#1e1e1e; padding:10px 12px; border-radius:12px; max-width:85%; border:1px solid #2a2a2a}
.msg.me{align-self:flex-end; background:#006B3F}
.msg .meta{font-size:11px; opacity:0.6; margin-bottom:3px}
.msg .text{font-size:15px; line-height:1.3; word-break:break-word}
#inputBar{display:flex; gap:8px; padding:10px; background:#1a1a1a; border-top:1px solid #333}
#messageInput{flex:1}
.small{font-size:12px; opacity:.7; text-align:center; margin:6px}
.footer{text-align:center; padding:16px; background:#0a0a0a; border-top:2px solid #FCD116; font-size:13px; color:#aaa; letter-spacing:0.5px; margin-top:auto}
.footer b{color:#FCD116}
</style>
</head>
<body>
<div class="header"><div class="logo">CHALECHAT 🇬🇭</div><div style="font-size:12px; background:black; padding:4px 8px; border-radius:20px">● LIVE</div></div>

<div id="loginPanel">
<h2 style="text-align:center; margin-bottom:16px">Akwaaba! Chale enter 😎</h2>
<div class="row"><input id="username" placeholder="Your name (e.g. Kwesi)"></div>
<div class="row"><label style="font-size:13px; opacity:.8">Choose Language</label>
<div class="langRow">
<button onclick="setLang('en')" id="btn-en" class="active">English</button>
<button onclick="setLang('tw')" id="btn-tw">Twi</button>
<button onclick="setLang('pidgin')" id="btn-pidgin">Pidgin</button>
</div></div>
<button style="width:100%; margin-top:8px" onclick="enterChat()">Enter Chat →</button>
<div class="small">Your messages go live for everyone in Ghana 🌍</div>
</div>

<div id="chatArea"><div id="messages"></div><div id="inputBar"><input id="messageInput" placeholder="Type message... Kakraka?" onkeydown="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()">Send 🚀</button></div></div>

<div class="footer">
Powered by <b>SALVATION TECH-GHANA</b> 🇬🇭 | Made in Accra with ❤️ | © 2026 All Rights Reserved
</div>

<script>
const SUPABASE_URL = 'https://gmdtjtznwsimcseurntt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_79O8wusGRZszR6zezkihgg_nsfZ1u34';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentUser = ''; let currentLang = 'en';
function setLang(l){ currentLang=l; document.querySelectorAll('.langRow button').forEach(b=>b.classList.remove('active')); document.getElementById('btn-'+l).classList.add('active'); }
async function enterChat(){ const name=document.getElementById('username').value.trim(); if(!name){ alert('Enter your name chale!'); return; } currentUser=name; document.getElementById('loginPanel').style.display='none'; document.getElementById('chatArea').style.display='flex'; await loadMessages(); subscribe(); }
async function loadMessages(){ const { data } = await supabaseClient.from('messages').select('*').order('created_at',{ascending:true}).limit(100); if(!data) return; document.getElementById('messages').innerHTML=''; data.forEach(addMessageToUI); scrollDown(); }
function subscribe(){ supabaseClient.channel('chalechat-room').on('postgres_changes',{event:'INSERT', schema:'public', table:'messages'}, p=>{ addMessageToUI(p.new); scrollDown(); }).subscribe(); }
function addMessageToUI(m){ const div=document.createElement('div'); const isMe=m.username===currentUser; div.className='msg'+(isMe?' me':''); const time=new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); div.innerHTML=`<div class="meta">${m.username} • ${time}</div><div class="text">${m.message.replace(/</g,'&lt;')}</div>`; document.getElementById('messages').appendChild(div); }
function scrollDown(){ const el=document.getElementById('messages'); el.scrollTop=el.scrollHeight; }
async function sendMsg(){ const inp=document.getElementById('messageInput'); const text=inp.value.trim(); if(!text) return; inp.value=''; await supabaseClient.from('messages').insert([{username: currentUser, message: text, lang: currentLang}]); }
</script>
</body>
</html>
