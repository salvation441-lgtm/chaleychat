<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChaleChat - SALVATION TECH-GHANA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui; background:#0f0f0f; color:white; min-height:100vh; display:flex; flex-direction:column}
.header{background:linear-gradient(90deg,#CE1126,#FCD116,#006B3F); padding:12px 16px; font-weight:900}
#loginPanel{max-width:380px; margin:50px auto; background:#1a1a1a; padding:24px; border-radius:16px; border:1px solid #333; width:90%; text-align:center}
input{padding:12px; background:#222; color:white; border:1px solid #333; width:100%; border-radius:10px; margin:10px 0}
button{padding:12px; background:#FCD116; color:black; font-weight:800; border:none; border-radius:10px; cursor:pointer; width:100%}
#chatArea{display:none; flex:1; flex-direction:column; overflow:hidden}
#messages{flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; background:#121212}
.msg{padding:10px 12px; border-radius:14px; max-width:80%; animation:pop .2s}
@keyframes pop{from{transform:scale(.9); opacity:0}to{transform:scale(1); opacity:1}}
.me{align-self:flex-end; background:#006B3F}
.bot{align-self:flex-start; background:#1a2a4a; border:1px solid #FCD116}
.meta{font-size:10px; opacity:.5; margin-bottom:2px}
#bar{display:flex; gap:6px; padding:10px; background:#1a1a1a; border-top:1px solid #333}
#msgInput{flex:1}
.footer{text-align:center; padding:8px; background:#000; font-size:10px; color:#888; border-top:2px solid #FCD116}
.typing{font-size:11px; color:#aaa; padding:0 12px 6px; font-style:italic; display:none}
</style>
</head>
<body>
<div class="header">CHALECHAT FIXED 🇬🇭 — ALWAYS REPLY</div>

<div id="loginPanel">
<h2>Akwaaba! 🇬🇭</h2>
<p style="font-size:12px; background:#006B3F; padding:8px; border-radius:8px; margin:10px 0">✅ NEW: Bot go reply 100% — no more ghosting!</p>
<input id="username" placeholder="Your name e.g. Kwame">
<button onclick="enterChat()">Enter Chat →</button>
</div>

<div id="chatArea">
<div id="messages"></div>
<div class="typing" id="typing">ChaleBot dey type...</div>
<div id="bar">
<input id="msgInput" placeholder="Type anything..." onkeydown="if(event.key==='Enter')send()">
<button onclick="send()" style="width:80px">Send 🚀</button>
</div>
</div>

<div class="footer">Powered by <b style="color:#FCD116">SALVATION TECH-GHANA</b> 🇬🇭 Made in Accra © 2026</div>

<script>
const SUPABASE_URL='https://gmdtjtznwsimcseurntt.supabase.co';
const SUPABASE_KEY='sb_publishable_79O8wusGRZszR6zezkihgg_nsfZ1u34';
let supa; try{ supa=supabase.createClient(SUPABASE_URL,SUPABASE_KEY); }catch{}
let me=''; let lastReply=''; let welcomed=false;

function getReply(t){
  let q=t.toLowerCase().trim();
  const pick=(arr)=>{ let r; do{ r=arr[Math.floor(Math.random()*arr.length)]; }while(r===lastReply&&arr.length>1); lastReply=r; return r; };
  
  if(!q) return "Chale you send empty? 😂";
  if(q.includes('chairman')||q.includes('bossu')||q.includes('boss')) return pick(["Chairman! Bossu! 😎 How far?","Oga Chairman! Respect! Weytin dey?","Bossu! You don show! How body?","Chairman! How you dey?"]);
  if(['hello','hi','hey','akwaaba','how far'].some(w=>q.includes(w))) return pick(["Akwaaba chaley! How you dey? 😎","Yo Chairman! I dey! You?","Hey! I dey cool! How Accra dey?"]);
  if(q.includes('how are you')||q.includes('wo ho')||q.includes('how you dey')) return pick(["I dey cool chale! Body dey inside cloth 😎 You?","I dey! All good for here! You nso?","Cool cool! We dey! You?"]);
  if(['haha','lol','😂','hehe'].some(w=>q.includes(w))) return pick(["😂 You go kill me!","Haha Chairman! You funny!","Lol! Ei! 😂","Chale you dey laugh me? 😅"]);
  if(q.length<=7) return pick(["Ei?","For real? 😅","Chale!","Na wa o!","You say?","Boss? 😂"]);
  if(q.includes('vex')||q.includes('ghost')) return "Chale sorry! 😅 I no go ghost you again! I dey here now! Make we chat!";
  return pick(["Chale I feel you! True talk!","You get point Chairman!","Ei that be deep! Tell me more!","True true! Accra life be that!","I hear you! We dey learn everyday!","Bossu you dey talk sense!"]);
}

function addMsg(user, text){
  const box=document.getElementById('messages');
  const isMe=user===me; const isBot=user==='ChaleBot AI';
  const div=document.createElement('div');
  div.className='msg '+(isMe?'me':'bot');
  const time=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  div.innerHTML=`<div class="meta">${user} • ${time}</div><div>${text.replace(/</g,'&lt;')}</div>`;
  box.appendChild(div);
  box.scrollTop=box.scrollHeight;
}

function enterChat(){
  let n=document.getElementById('username').value.trim();
  if(!n){ alert('Enter name'); return; }
  me=n;
  document.getElementById('loginPanel').style.display='none';
  document.getElementById('chatArea').style.display='flex';
  loadOld();
  if(!welcomed){
    setTimeout(()=>{ addMsg('ChaleBot AI','Akwaaba chaley'); welcomed=true; },500);
  }
}
async function loadOld(){
  try{
    if(!supa) return;
    let {data}=await supa.from('messages').select('*').order('created_at',{ascending:true}).limit(40);
    if(data){ document.getElementById('messages').innerHTML=''; data.forEach(m=>addMsg(m.username,m.message)); }
  }catch{}
}

function send(){
  let inp=document.getElementById('msgInput');
  let t=inp.value.trim(); if(!t) return;
  inp.value='';
  
  // 1. Your message - INSTANT
  addMsg(me,t);
  if(supa){ supa.from('messages').insert([{username:me,message:t}]).then(()=>{}).catch(()=>{}); }

  // 2. Bot typing then reply - INSTANT LOCAL, no wait for supabase
  document.getElementById('typing').style.display='block';
  setTimeout(()=>{
    document.getElementById('typing').style.display='none';
    let r=getReply(t);
    addMsg('ChaleBot AI',r);
    if(supa){ supa.from('messages').insert([{username:'ChaleBot AI',message:r}]).then(()=>{}).catch(()=>{}); }
  }, 800);
}

// Listen for other people (optional)
try{
  supa.channel('chale').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{
    let m=p.new; if(m.username===me||m.username==='ChaleBot AI') return;
    addMsg(m.username,m.message);
  }).subscribe();
}catch{}
</script>
</body>
</html>
