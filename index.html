<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChaleChat Global AI - SALVATION TECH-GHANA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui; background:#0f0f0f; color:white; min-height:100vh; display:flex; flex-direction:column}
.header{background:linear-gradient(90deg,#CE1126,#FCD116,#006B3F); padding:12px 16px; font-weight:900; display:flex; justify-content:space-between; align-items:center}
#loginPanel{max-width:400px; margin:40px auto; background:#1a1a1a; padding:24px; border-radius:16px; border:1px solid #333; width:90%; text-align:center}
input{padding:12px; background:#222; color:white; border:1px solid #333; width:100%; border-radius:10px; margin:10px 0}
button{padding:12px; background:#FCD116; color:black; font-weight:800; border:none; border-radius:10px; cursor:pointer}
#chatArea{display:none; flex:1; flex-direction:column; overflow:hidden}
#messages{flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; background:#121212}
.msg{padding:10px 12px; border-radius:14px; max-width:88%; line-height:1.4}
.me{align-self:flex-end; background:#006B3F}
.bot{align-self:flex-start; background:#1a2a4a; border:1px solid #FCD116}
.meta{font-size:10px; opacity:.5; margin-bottom:3px}
#bar{display:flex; gap:6px; padding:10px; background:#1a1a1a; border-top:1px solid #333}
#msgInput{flex:1}
.footer{text-align:center; padding:8px; background:#000; font-size:10px; color:#888; border-top:2px solid #FCD116}
.typing{font-size:11px; color:#FCD116; padding:0 12px 6px; display:none}
.botBadge{font-size:9px; background:#FCD116; color:black; padding:2px 6px; border-radius:8px; font-weight:900; margin-left:5px}
</style>
</head>
<body>
<div class="header"><div>CHALECHAT GLOBAL AI 🌍🇬🇭</div><div style="font-size:10px; background:black; padding:4px 8px; border-radius:10px">GLOBAL</div></div>

<div id="loginPanel">
<h2>Akwaaba! Global AI!</h2>
<p style="font-size:12px; background:#1a2a4a; border:1px solid #FCD116; padding:10px; border-radius:10px; margin:12px 0">🌍 Now bot sabi EVERYTHING — Ghana, America, Science, Maths, Football, History! Ask anything!</p>
<input id="username" placeholder="Your name">
<button onclick="enterChat()">Enter Global Chat →</button>
</div>

<div id="chatArea">
<div id="messages"></div>
<div class="typing" id="typing">🌍 ChaleBot dey search whole world...</div>
<div id="bar">
<input id="msgInput" placeholder="Ask anything... e.g. How many planets?" onkeydown="if(event.key==='Enter')send()">
<button onclick="send()" style="width:80px">Send 🚀</button>
</div>
</div>

<div class="footer">Powered by <b style="color:#FCD116">SALVATION TECH-GHANA</b> 🇬🇭 | Global AI Engine | Accra © 2026</div>

<script>
const SUPABASE_URL='https://gmdtjtznwsimcseurntt.supabase.co';
const SUPABASE_KEY='sb_publishable_79O8wusGRZszR6zezkihgg_nsfZ1u34';
let supa; try{ supa=supabase.createClient(SUPABASE_URL,SUPABASE_KEY); }catch{}
let me=''; let welcomed=false;

async function askGlobalAI(question){
  // 1. Try Pollinations Free AI (Global Knowledge - no key needed)
  try{
    let prompt = `You are ChaleBot, a friendly Ghanaian AI from SALVATION TECH-GHANA. You speak like a Ghanaian friend (Chale, Chairman, Bossu) but you have global knowledge. Answer briefly, friendly, in 2-3 sentences max. If question is short like "Lol" or "Ei?" reply with Ghanaian humor. Question: ${question}`;
    let res = await fetch('https://text.pollinations.ai/' + encodeURIComponent(prompt), {method:'GET'});
    if(res.ok){
      let txt = await res.text();
      if(txt && txt.length > 2 && txt.length < 800) return txt;
    }
  }catch(e){}

  // 2. Fallback Local Brain (if internet fail)
  let q=question.toLowerCase();
  if(q.includes('how many') && q.includes('region') && q.includes('ghana')) return "🇬🇭 Ghana get 16 regions! From Greater Accra to Upper West. We increased from 10 to 16 in 2019!";
  if(q.includes('how many') && q.includes('planet')) return "🌍 We get 8 planets! Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune. Pluto be dwarf planet now!";
  if(q.includes('capital') && q.includes('ghana')) return "Capital of Ghana be Accra! 🇬🇭";
  if(q.includes('who is') || q.includes('what is')) return "Chale that be interesting question! '"+question+"' — Make I check? Global AI dey think... Generally, you fit search Google but I go try explain! Chairman, you dey learn o! 😎";
  if(['haha','lol','😂'].some(w=>q.includes(w))) return "😂 Chairman you go kill me with laugh!";
  if(q.length<=6) return "Ei? Tell me more Chairman! 😅";
  return "Chale I hear you! '"+question+"' — That be deep! Global AI dey learn everyday! Tell me more!";
}

function addMsg(user, text){
  const box=document.getElementById('messages');
  const isMe=user===me;
  const div=document.createElement('div');
  div.className='msg '+(isMe?'me':'bot');
  const time=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  div.innerHTML=`<div class="meta">${user}${user==='ChaleBot AI'?' <span class="botBadge">GLOBAL AI</span>':''} • ${time}</div><div style="white-space:pre-wrap">${text.replace(/</g,'&lt;')}</div>`;
  box.appendChild(div); box.scrollTop=box.scrollHeight;
}

async function enterChat(){
  let n=document.getElementById('username').value.trim();
  if(!n){ alert('Enter name'); return; }
  me=n;
  document.getElementById('loginPanel').style.display='none';
  document.getElementById('chatArea').style.display='flex';
  if(!welcomed){ addMsg('ChaleBot AI','Akwaaba chaley'); welcomed=true; }
}

async function send(){
  let inp=document.getElementById('msgInput');
  let t=inp.value.trim(); if(!t) return; inp.value='';
  
  addMsg(me,t);
  if(supa) supa.from('messages').insert([{username:me,message:t}]).catch(()=>{});
  
  document.getElementById('typing').style.display='block';
  
  // GET GLOBAL ANSWER
  let reply = await askGlobalAI(t);
  
  document.getElementById('typing').style.display='none';
  addMsg('ChaleBot AI', reply);
  if(supa) supa.from('messages').insert([{username:'ChaleBot AI',message:reply}]).catch(()=>{});
}
</script>
</body>
</html>
