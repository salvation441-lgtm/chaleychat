<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChaleChat + Voice AI - SALVATION TECH-GHANA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui; background:#0f0f0f; color:white; min-height:100vh; display:flex; flex-direction:column}
.header{background:linear-gradient(90deg,#CE1126,#FCD116,#006B3F); padding:12px 16px; display:flex; justify-content:space-between; align-items:center}
.logo{font-weight:900; font-size:19px}
input,button{border-radius:10px; border:none; outline:none}
input{padding:10px 12px; background:#222; color:white; border:1px solid #333; width:100%}
button{padding:10px 14px; background:#FCD116; color:black; font-weight:700; cursor:pointer}
#loginPanel{max-width:420px; margin:40px auto; background:#1a1a1a; padding:24px; border-radius:16px; border:1px solid #333; width:90%}
.langRow{display:flex; gap:8px}
.langRow button{flex:1; background:#222; color:white; border:1px solid #444; padding:10px}
.langRow button.active{background:#006B3F; color:white}
#chatArea{display:none; flex:1; flex-direction:column; overflow:hidden}
#messages{flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; background:#121212}
.msg{background:#1e1e1e; padding:10px 12px; border-radius:12px; max-width:85%; border:1px solid #2a2a2a}
.msg.me{align-self:flex-end; background:#006B3F}
.msg.bot{align-self:flex-start; background:#1a2a4a; border-color:#FCD116}
.msg .meta{font-size:11px; opacity:0.6; margin-bottom:3px}
.msg .text{font-size:14px; line-height:1.35}
#inputBar{display:flex; gap:6px; padding:10px; background:#1a1a1a; border-top:1px solid #333; align-items:center}
#messageInput{flex:1}
.iconBtn{width:44px; height:42px; display:flex; align-items:center; justify-content:center; border-radius:10px; font-size:18px}
.mic-recording{background:red !important; color:white !important; animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.footer{text-align:center; padding:12px; background:#0a0a0a; border-top:2px solid #FCD116; font-size:12px; color:#aaa}
.footer b{color:#FCD116}
.botBadge{font-size:10px; background:#FCD116; color:black; padding:2px 6px; border-radius:10px; margin-left:6px; font-weight:900}
.voiceNote{display:flex; align-items:center; gap:8px; background:#222; padding:6px 10px; border-radius:20px; margin-top:4px}
</style>
</head>
<body>
<div class="header"><div class="logo">CHALECHAT + VOICE AI 🇬🇭</div><div style="font-size:11px; background:black; padding:4px 8px; border-radius:20px">🎤🔊 LIVE</div></div>

<div id="loginPanel">
<h2 style="text-align:center; margin-bottom:12px">Akwaaba! 🎤 Enter</h2>
<div style="text-align:center; margin-bottom:14px; background:#1a2a4a; padding:10px; border-radius:10px; border:1px solid #FCD116; font-size:13px">🎤 <b>NEW VOICE:</b> Tap mic, speak Twi/Pidgin/English!<br>Bot go talk back with voice!</div>
<input id="username" placeholder="Your name (e.g. Kwesi)" style="margin-bottom:12px">
<label style="font-size:13px; opacity:.8">Choose Language</label>
<div class="langRow" style="margin-top:6px; margin-bottom:14px">
<button onclick="setLang('en')" id="btn-en" class="active">English</button>
<button onclick="setLang('tw')" id="btn-tw">Twi</button>
<button onclick="setLang('pidgin')" id="btn-pidgin">Pidgin</button>
</div>
<button style="width:100%" onclick="enterChat()">Enter Chat →</button>
<div style="font-size:11px; opacity:.6; text-align:center; margin-top:8px">🔊 Allow microphone when asked</div>
</div>

<div id="chatArea"><div id="messages"></div>
<div id="inputBar">
<button class="iconBtn" id="micBtn" onclick="toggleVoice()" title="Hold to speak">🎤</button>
<input id="messageInput" placeholder="Tap 🎤 to speak or type @bot..." onkeydown="if(event.key==='Enter')sendMsg()">
<button class="iconBtn" onclick="toggleBotVoice()" id="soundBtn" title="Bot Voice On/Off">🔊</button>
<button class="iconBtn" onclick="askBot()">🤖</button>
<button onclick="sendMsg()" style="background:#FCD116">Send 🚀</button>
</div>
<div style="text-align:center; font-size:11px; padding:4px; background:#111; color:#888" id="voiceStatus">🎤 Tap mic and speak Twi, Pidgin or English</div>
</div>

<div class="footer">Powered by <b>SALVATION TECH-GHANA</b> 🇬🇭 | Voice AI by ChaleBot | Made in Accra ❤️ © 2026</div>

<script>
const SUPABASE_URL = 'https://gmdtjtznwsimcseurntt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_79O8wusGRZszR6zezkihgg_nsfZ1u34';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentUser = ''; let currentLang = 'en'; let botVoiceOn = true; let recognition; let isRecording=false;

function setLang(l){ currentLang=l; document.querySelectorAll('.langRow button').forEach(b=>b.classList.remove('active')); document.getElementById('btn-'+l).classList.add('active'); }

const twiDict = {"akwaaba":"welcome","medaase":"thank you","wo ho te sɛn":"how are you"};
function chaleBotAI(text, userLang){
  text=(text||'').toLowerCase();
  if(text.includes("hello")||text.includes("hi")||text.includes("how far")||text.includes("akwaaba")){
    if(userLang==='tw') return "Akwaaba chale! Wo ho te sɛn? Me ne ChaleBot! Me tumi kasa Twi! Ka biribi!";
    if(userLang==='pidgin') return "How far my guy! I be ChaleBot, I sabi Pidgin die! Wetin you want make we yan?";
    return "Akwaaba chale! I'm ChaleBot with VOICE! 🎤 I now dey talk! How can I help?";
  }
  if(text.includes("ghana")) return "Ghana yɛ number 1! 🇬🇭 Black Stars, Jollof, Accra vibes! SALVATION TECH-GHANA dey lead with AI!";
  if(text.includes("who")||text.includes("what are you")) return "I be ChaleBot Voice AI 🤖🔊, built by SALVATION TECH-GHANA! I dey understand and SPEAK Twi, Pidgin, English!";
  if(userLang==='tw') return `Me te "${text}"! Ka Twi kɛkɛ, me bɛ mmua wo!`;
  if(userLang==='pidgin') return `I hear you: "${text}". My guy, talk more make I answer you with voice!`;
  return `I hear you chale! "${text}" — I fit answer with voice now! Try "@bot sing Ghana song"`;
}

// VOICE INPUT
function initVoice(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){ document.getElementById('voiceStatus').innerText='❌ Voice not supported on this browser, use Chrome'; return; }
  recognition = new SpeechRecognition();
  recognition.continuous=false; recognition.interimResults=true; recognition.lang='en-GH';
  recognition.onstart=()=>{ isRecording=true; document.getElementById('micBtn').classList.add('mic-recording'); document.getElementById('voiceStatus').innerText='🔴 Listening... Kasa! Speak now!'; };
  recognition.onend=()=>{ isRecording=false; document.getElementById('micBtn').classList.remove('mic-recording'); document.getElementById('voiceStatus').innerText='🎤 Tap mic again to speak'; };
  recognition.onresult=(e)=>{ let transcript=''; for(let i=e.resultIndex;i<e.results.length;i++){ transcript+=e.results[i][0].transcript; } document.getElementById('messageInput').value=transcript; if(e.results[0].isFinal){ setTimeout(()=>{ if(transcript.toLowerCase().includes('bot')) sendMsg(); }, 600); } };
  recognition.onerror=()=>{ isRecording=false; document.getElementById('micBtn').classList.remove('mic-recording'); };
}
function toggleVoice(){ if(!recognition) initVoice(); if(isRecording){ recognition.stop(); } else { try{ recognition.lang = currentLang==='tw'?'ak-GH': currentLang==='pidgin'?'en-NG':'en-GH'; recognition.start(); }catch{} } }

function speakText(text){
  if(!botVoiceOn) return;
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate=0.95; u.pitch=1; u.lang = currentLang==='tw'?'en-GH':'en-GH';
  window.speechSynthesis.speak(u);
}
function toggleBotVoice(){ botVoiceOn=!botVoiceOn; document.getElementById('soundBtn').innerText=botVoiceOn?'🔊':'🔇'; document.getElementById('voiceStatus').innerText= botVoiceOn?'🔊 Bot voice ON':'🔇 Bot voice OFF'; speakText(botVoiceOn?'Voice on chale!':''); }

// CHAT LOGIC
async function enterChat(){ const name=document.getElementById('username').value.trim(); if(!name){ alert('Enter name!'); return; } currentUser=name; document.getElementById('loginPanel').style.display='none'; document.getElementById('chatArea').style.display='flex'; initVoice(); await loadMessages(); subscribe(); setTimeout(()=>{ const welcome=chaleBotAI('hello',currentLang); addMessageToUI({username:'ChaleBot AI', message: welcome, created_at: new Date().toISOString(), isBot:true, lang:'VOICE AI'}, true); speakText(welcome); }, 800); }
async function loadMessages(){ const { data } = await supabaseClient.from('messages').select('*').order('created_at',{ascending:true}).limit(100); if(!data) return; document.getElementById('messages').innerHTML=''; data.forEach(m=>addMessageToUI(m)); scrollDown(); }
function subscribe(){ supabaseClient.channel('chalechat-room-voice').on('postgres_changes',{event:'INSERT', schema:'public', table:'messages'}, p=>{ addMessageToUI(p.new); scrollDown(); if(p.new.username!==currentUser && p.new.username!=='ChaleBot AI'){ checkBotTrigger(p.new); } }).subscribe(); }
function addMessageToUI(m){
  const div=document.createElement('div'); const isMe=m.username===currentUser; const isBot=m.username==='ChaleBot AI';
  div.className='msg'+(isMe?' me': isBot?' bot':'');
  const time=new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  const botTag = isBot ? '<span class="botBadge">VOICE AI</span>' : '';
  div.innerHTML=`<div class="meta">${m.username}${botTag} • ${time}</div><div class="text">${m.message.replace(/</g,'&lt;')}</div>${isBot?`<div style="margin-top:6px"><button onclick="speakText(this.parentElement.previousElementSibling.innerText)" style="font-size:10px; padding:4px 8px; background:#333; color:#fff">🔊 Play Voice</button></div>`:''}`;
  document.getElementById('messages').appendChild(div);
}
function scrollDown(){ const el=document.getElementById('messages'); el.scrollTop=el.scrollHeight; }
async function sendMsg(){ const inp=document.getElementById('messageInput'); const text=inp.value.trim(); if(!text) return; inp.value=''; await supabaseClient.from('messages').insert([{username: currentUser, message: text, lang: currentLang}]); checkBotTrigger({message:text, username:currentUser, lang:currentLang}); }
function askBot(){ const inp=document.getElementById('messageInput'); if(!inp.value.trim()){ inp.value='@bot '; inp.focus(); return; } if(!inp.value.toLowerCase().includes('@bot')) inp.value='@bot '+inp.value; sendMsg(); }
function checkBotTrigger(m){
  if(m.message.toLowerCase().includes('@bot') || (m.username===currentUser && m.message.includes('?'))){
    const reply = chaleBotAI(m.message.replace('@bot',''), m.lang||currentLang);
    setTimeout(async ()=>{
      await supabaseClient.from('messages').insert([{username: 'ChaleBot AI', message: reply, lang: 'VOICE AI'}]);
      speakText(reply);
    }, 900);
  }
}
</script>
</body>
</html>
